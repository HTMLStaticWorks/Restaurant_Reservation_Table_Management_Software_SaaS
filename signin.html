<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — TableFlow Restaurant Management</title>
  <meta name="description" content="Sign in to your TableFlow account to manage reservations, tables, and guests." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Minimal top bar -->
  <div style="position:fixed;top:0;left:0;right:0;height:64px;background:rgba(7,9,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;color:#f1f5f9;text-decoration:none;">
      <div style="width:32px;height:32px;background:linear-gradient(135deg,#14b8a6,#0891b2);border-radius:8px;display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      TableFlow
    </a>
    <span style="font-size:14px;color:#64748b;">Don't have an account? <a href="signup.html" style="color:#14b8a6;font-weight:600;text-decoration:none;">Sign up free</a></span>
  </div>

  <div class="auth-page">
    <div class="auth-bg"></div>

    <!-- Decorative blobs -->
    <div style="position:absolute;top:20%;left:5%;width:300px;height:300px;background:radial-gradient(ellipse,rgba(20,184,166,0.06),transparent 70%);pointer-events:none;"></div>
    <div style="position:absolute;bottom:10%;right:5%;width:400px;height:400px;background:radial-gradient(ellipse,rgba(8,145,178,0.06),transparent 70%);pointer-events:none;"></div>

    <div class="auth-card">
      <div class="auth-logo">
        <div style="width:48px;height:48px;background:linear-gradient(135deg,#14b8a6,#0891b2);border-radius:12px;display:flex;align-items:center;justify-content:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </div>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your TableFlow account</p>

      <form onsubmit="handleSignIn(event)" id="signin-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="signin-email">Email address</label>
          <input type="email" id="signin-email" class="form-input" placeholder="you@restaurant.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <label class="form-label" for="signin-password" style="margin-bottom:0;">Password</label>
            <a href="#" class="form-link" style="font-size:13px;">Forgot password?</a>
          </div>
          <div style="position:relative;">
            <input type="password" id="signin-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" onclick="togglePwd('signin-password',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748b;display:flex;align-items:center;" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:24px;">
          <input type="checkbox" id="remember-me" style="width:16px;height:16px;accent-color:var(--clr-primary);cursor:pointer;" />
          <label for="remember-me" style="font-size:13px;color:#94a3b8;cursor:pointer;">Remember me for 30 days</label>
        </div>

        <div id="signin-error" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:10px;padding:12px 16px;font-size:13px;color:#f87171;margin-bottom:16px;">
          Invalid email or password. Please try again.
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="signin-submit-btn">Sign In</button>
      </form>

      <div class="form-divider">or continue with</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;">
        <button onclick="socialLogin('Google')" class="btn btn-outline btn-full" style="padding:12px 16px;font-size:14px;border-radius:10px;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button onclick="socialLogin('Microsoft')" class="btn btn-outline btn-full" style="padding:12px 16px;font-size:14px;border-radius:10px;">
          <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f3f3f3" d="M0 0h23v23H0z"/><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
          Microsoft
        </button>
      </div>

      <p class="form-footer-text">Don't have an account? <a href="signup.html" class="form-link">Sign up free</a></p>
    </div>
  </div>

  <script>
    function togglePwd(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function handleSignIn(e) {
      e.preventDefault();
      const btn = document.getElementById('signin-submit-btn');
      btn.textContent = 'Signing in...';
      btn.disabled = true;
      // Simulate auth
      setTimeout(() => {
        document.getElementById('signin-error').style.display = 'block';
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }, 1200);
    }

    function socialLogin(provider) {
      alert('Social login with ' + provider + ' — connect your OAuth provider here.');
    }
  </script>
</body>
</html>
