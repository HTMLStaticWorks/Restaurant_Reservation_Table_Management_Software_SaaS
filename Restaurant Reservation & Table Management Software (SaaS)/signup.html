<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — TableFlow Restaurant Management</title>
  <meta name="description" content="Start your free 14-day TableFlow trial. No credit card required. Set up in under 30 minutes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#14b8a6" />
</head>
<body>

  <!-- Theme & RTL Controls at top right -->
  <div style="position:fixed;top:24px;right:28px;z-index:100;display:flex;align-items:center;gap:12px;">
    <button id="theme-toggle" class="btn" aria-label="Toggle Theme" title="Toggle Theme" style="width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--clr-surface);border:1px solid var(--clr-border);cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <button id="rtl-toggle" class="btn" aria-label="Toggle RTL direction" title="Toggle RTL" style="width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--clr-surface);border:1px solid var(--clr-border);cursor:pointer;font-size:12px;font-weight:700;">
      RTL
    </button>
  </div>

  <div class="auth-page" style="padding-top:40px;padding-bottom:40px;">
    <div class="auth-bg"></div>

    <!-- Decorative blobs -->
    <div style="position:absolute;top:20%;left:5%;width:300px;height:300px;background:radial-gradient(ellipse,rgba(20,184,166,0.06),transparent 70%);pointer-events:none;"></div>
    <div style="position:absolute;bottom:10%;right:5%;width:400px;height:400px;background:radial-gradient(ellipse,rgba(8,145,178,0.06),transparent 70%);pointer-events:none;"></div>

    <div class="auth-card" style="max-width:500px;">
      <div class="auth-logo" style="margin-bottom:20px;">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:12px;text-decoration:none;transition:transform 0.2s ease;">
          <div style="width:44px;height:44px;background:linear-gradient(135deg,#14b8a6,#0891b2);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(20,184,166,0.35);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </div>
          <span style="font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:900;color:var(--clr-text);letter-spacing:-0.02em;">TableFlow</span>
        </a>
      </div>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Start your 14-day free trial. No credit card required.</p>

      <form onsubmit="handleSignUp(event)" id="signup-form" novalidate>
        <!-- Stacked one below one -->
        <div class="form-group">
          <label class="form-label" for="su-fname">First name</label>
          <input type="text" id="su-fname" class="form-input" placeholder="Marcus" required autocomplete="given-name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="su-lname">Last name</label>
          <input type="text" id="su-lname" class="form-input" placeholder="Rivera" required autocomplete="family-name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="su-email">Work email</label>
          <input type="email" id="su-email" class="form-input" placeholder="you@restaurant.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="su-restaurant">Restaurant name</label>
          <input type="text" id="su-restaurant" class="form-input" placeholder="The Olive Garden" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="su-size">Restaurant size</label>
          <select id="su-size" class="form-select" required>
            <option value="" disabled selected>Select seat capacity...</option>
            <option value="1-30">1–30 seats</option>
            <option value="31-80">31–80 seats</option>
            <option value="81-150">81–150 seats</option>
            <option value="150+">150+ seats</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="su-locations">Locations</label>
          <select id="su-locations" class="form-select" required>
            <option value="" disabled selected>Select number of locations...</option>
            <option value="1">1 location</option>
            <option value="2-5">2–5 locations</option>
            <option value="6+">6+ locations</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="su-password">Create password</label>
          <div style="position:relative;">
            <input type="password" id="su-password" class="form-input" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
            <button type="button" onclick="togglePwd('su-password',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748b;display:flex;align-items:center;" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <!-- Password strength meter -->
          <div style="margin-top:8px;display:flex;gap:4px;" id="strength-bars">
            <div style="flex:1;height:3px;border-radius:4px;background:#1e293b;" class="str-bar"></div>
            <div style="flex:1;height:3px;border-radius:4px;background:#1e293b;" class="str-bar"></div>
            <div style="flex:1;height:3px;border-radius:4px;background:#1e293b;" class="str-bar"></div>
            <div style="flex:1;height:3px;border-radius:4px;background:#1e293b;" class="str-bar"></div>
          </div>
          <div id="strength-label" style="font-size:11px;color:#64748b;margin-top:4px;"></div>
          <!-- Forgot password below password field -->
          <div style="display:flex;justify-content:flex-end;margin-top:8px;">
            <a href="#" onclick="alert('Password reset link sent to your email.');return false;" class="form-link" style="font-size:13px;color:var(--clr-primary);font-weight:600;">Forgot password?</a>
          </div>
        </div>

        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:24px;">
          <input type="checkbox" id="su-terms" required style="width:16px;height:16px;accent-color:var(--clr-primary);cursor:pointer;margin-top:2px;flex-shrink:0;" />
          <label for="su-terms" style="font-size:13px;color:#94a3b8;line-height:1.5;cursor:pointer;">I agree to the <a href="#" class="form-link">Terms of Service</a> and <a href="#" class="form-link">Privacy Policy</a></label>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="signup-submit-btn">Create Account</button>
      </form>

      <div id="signup-success" style="display:none;text-align:center;padding:32px 0;">
        <div style="font-size:48px;margin-bottom:16px;">🎉</div>
        <h3 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;color:#f1f5f9;margin-bottom:8px;">You're all set!</h3>
        <p style="color:#94a3b8;font-size:15px;margin-bottom:24px;">Check your inbox — we sent you a confirmation link to get started.</p>
        <a href="signin.html" class="btn btn-outline">Sign In to Your Account</a>
      </div>

      <div class="form-divider" style="margin-top:24px;">or continue with</div>

      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
        <button type="button" onclick="socialLogin('Google')" class="btn btn-outline btn-full" style="padding:12px 16px;font-size:14px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <button type="button" onclick="socialLogin('Apple')" class="btn btn-outline btn-full" style="padding:12px 16px;font-size:14px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.72-.94 2.74 1 .08 2.02-.49 2.64-1.24z"/></svg>
          Continue with Apple
        </button>
        <button type="button" onclick="socialLogin('Microsoft')" class="btn btn-outline btn-full" style="padding:12px 16px;font-size:14px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;">
          <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f3f3f3" d="M0 0h23v23H0z"/><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
          Continue with Microsoft
        </button>
      </div>

      <p class="form-footer-text" style="text-align:center;font-size:14px;color:var(--clr-text-muted);margin:0;">Already have an account? <a href="signin.html" class="form-link" style="color:var(--clr-primary);font-weight:700;">Sign in</a></p>
    </div>
  </div>

  <script>
    function togglePwd(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Password strength meter
    document.getElementById('su-password').addEventListener('input', function () {
      const val = this.value;
      const bars = document.querySelectorAll('.str-bar');
      const label = document.getElementById('strength-label');
      let strength = 0;
      if (val.length >= 8) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const colors = ['#ef4444','#f59e0b','#eab308','#10b981'];
      const labels = ['Weak','Fair','Good','Strong'];
      bars.forEach((bar, i) => {
        bar.style.background = i < strength ? colors[strength - 1] : '#1e293b';
      });
      label.textContent = val.length ? labels[strength - 1] || '' : '';
      label.style.color = strength ? colors[strength - 1] : '#64748b';
    });

    function handleSignUp(e) {
      e.preventDefault();
      const btn = document.getElementById('signup-submit-btn');
      btn.textContent = 'Creating account...';
      btn.disabled = true;
      setTimeout(() => {
        document.getElementById('signup-form').style.display = 'none';
        document.getElementById('signup-success').style.display = 'block';
      }, 1500);
    }

    function socialLogin(provider) {
      alert('Social sign-up with ' + provider + ' — connecting OAuth...');
    }
  </script>
  <script src="components.js"></script>
</body>
</html>
